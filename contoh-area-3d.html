<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Area 3D Gilbert</title>
<style>
@font-face{font-family:"PJS";src:url(fonts/pjs-500.woff2) format("woff2");font-weight:500}
@font-face{font-family:"PJS";src:url(fonts/pjs-800.woff2) format("woff2");font-weight:800}
:root{--bg:#EEF6E2;--ink:#1B1236;--tosca:#2EE6C5;--wortel:#FF8A1F;--mute:#55536A;--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 "PJS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 16px;color:var(--mute)}
.stage{position:relative;height:420px;border:1.5px solid var(--ink);border-radius:20px;box-shadow:2px 2px 0 var(--ink);overflow:hidden;background:radial-gradient(120% 90% at 50% 15%,#fff 0%,#E3F4D6 60%,#D3EBC2 100%);touch-action:none;cursor:grab;outline:none}
.stage canvas{display:block;width:100%;height:100%}
.stage:focus-visible{box-shadow:0 0 0 4px var(--tosca),2px 2px 0 var(--ink)}
.status{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#F3EEFF;border-radius:999px;padding:9px 16px;font-size:14px;white-space:nowrap;pointer-events:none;transition:background-color 200ms ease,color 200ms ease}
.status.ok{background:var(--tosca);color:var(--ink)}
.status.err{background:var(--wortel);color:var(--ink)}
.status.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button{font:inherit;font-weight:800;min-height:48px;border-radius:14px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:0 16px;cursor:pointer;flex:1;transition:transform 140ms var(--ease-out)}
button:active{transform:scale(.97)}
button.pri{background:var(--ink);color:var(--tosca)}
.note{color:var(--mute);font-size:13px;margin-top:14px}
@media (prefers-reduced-motion:reduce){.status.busy::before{animation:none}}
</style>
</head>
<body>
<main>
  <h1>Area 3D Gilbert</h1>
  <p class="sub">Gabungan peti kayu bercahaya dan truk pengantar. Seret file ke area, atau pakai tombol di bawah.</p>
  <div class="stage" tabindex="0" role="button" aria-label="Area unggah nota. Tekan Enter untuk memilih file."><span class="status">Seret nota ke peti</span></div>
  <div class="row">
    <button class="pri" data-ok>Coba: nota terbaca</button>
    <button data-err>Coba: nota gagal dibaca</button>
  </div>
  <p class="note">Contoh tampilan: file tidak dibaca dan tidak dikirim. Di aplikasi asli, status "Membaca" berlangsung selama nota benar-benar dibaca.</p>
</main>
<script src="vendor/three.min.js"></script>
<script src="js/scene3d.js"></script>
<script>
const el = document.querySelector('.stage'), st = el.querySelector('.status');
const S = Scene3D.create(el);
const status = (t, c = '') => { st.textContent = t; st.className = 'status ' + c; };
async function run(ok, name = 'nota.xlsx') {
  if (S.busy) return;
  status('Memasukkan ' + name, 'busy');
  await S.receive();
  status('Membaca nota…', 'busy');
  await new Promise(r => setTimeout(r, 1200)); // di aplikasi: waktu baca Excel/foto
  if (ok) { await S.success(); status('Terkirim ke Xander ✓', 'ok'); }
  else { status('Nota belum terbaca. Coba foto lebih jelas', 'err'); await S.error(); }
  setTimeout(() => !S.busy && status('Seret nota ke peti'), 2200);
}
let depth = 0;
el.addEventListener('dragenter', e => { e.preventDefault(); if (depth++ === 0) { S.hover(true); if (!S.busy) status('Lepaskan di peti'); } });
el.addEventListener('dragover', e => e.preventDefault());
el.addEventListener('dragleave', () => { if (--depth === 0) { S.hover(false); if (!S.busy) status('Seret nota ke peti'); } });
el.addEventListener('drop', e => { e.preventDefault(); depth = 0; const f = e.dataTransfer.files[0]; run(true, f ? f.name : 'nota'); });
el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); run(true); } });
document.querySelector('[data-ok]').onclick = () => run(true);
document.querySelector('[data-err]').onclick = () => run(false, 'foto-buram.jpg');
</script>
</body>
</html>
